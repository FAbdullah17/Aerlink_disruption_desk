[project]
name = "aerlink-disruption-desk"
version = "0.1.0"
description = "Automated disruption desk for Aerlink airline"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27,<1",
    "openai>=1.50,<2",
    "pydantic>=2.0,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
